schema:
  target_column: "Churn"
  binary_columns:
    - "gender"
    - "SeniorCitizen"
    - "Partner"
    - "Dependents"
    - "PhoneService"
    - "PaperlessBilling"
  ordinal_columns:
    - "MultipleLines"
    - "InternetService"
    - "OnlineSecurity"
    - "OnlineBackup"
    - "DeviceProtection"
    - "TechSupport"
    - "StreamingTV"
    - "StreamingMovies"
    - "Contract"
    - "PaymentMethod"
  feature_columns:
    - "gender"
    - "SeniorCitizen"
    - "Partner"
    - "Dependents"
    - "PhoneService"
    - "PaperlessBilling"
    - "tenure"
    - "MultipleLines"
    - "InternetService"
    - "OnlineSecurity"
    - "OnlineBackup"
    - "DeviceProtection"
    - "TechSupport"
    - "StreamingTV"
    - "StreamingMovies"
    - "Contract"
    - "PaymentMethod"
    - "MonthlyCharges"
    - "TotalCharges"

preprocessing:
  test_size: 0.2
  random_state: 42

train:
  num_boost_round: 3000
  early_stopping_rounds: 100
  verbose_eval: 100
  xgb_params:
    objective: "binary:logistic"
    learning_rate: 0.03
    max_depth: 6
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 3
    tree_method: "hist"
    random_state: 42
    nthread: -1
    eval_metric:
      - "logloss"
      - "auc"
      - "aucpr"

evaluate:
  classification_threshold: 0.5

metadata:
  registered_model_name: "churn_model"
  model_type: "XGBoost Classifier"
  developer: "ML Engineering Team"
