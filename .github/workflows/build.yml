---
name: Build & Publish Images

# Trigger
"on":
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Global environment variables
env:
  PYTHON_VERSION: "3.12"

# Jobs
jobs:
  # JOB 1 · Build, Scan & Publish Container Image
  build-and-publish:
    name: Build, Scan & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service: [api, dashboard]

    steps:
      # 1. Checkout full repo history
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # 2. Convert repository handle to lower-case for GHCR compatibility
      - name: Set image name
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/churn-prediction-${{ matrix.service }}"
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> $GITHUB_ENV

      # 3. Setup uv dependency manager with matrix-specific caching
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: "build-image-${{ matrix.service }}"

      # 4. Install Python runtime
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      # 5. Install dependencies
      - name: Install dependencies
        run: uv sync --frozen --no-dev

      # 6. Configure DVC remote credentials
      - name: Configure DVC
        env:
          DAGSHUB_ACCESS_ID: ${{ secrets.DAGSHUB_ACCESS_ID }}
        run: |
            uv run dvc remote add -fd origin s3://dvc || true
            uv run dvc remote modify origin endpointurl https://dagshub.com/vipinkr/churn-prediction.s3
            uv run dvc remote modify origin --local access_key_id ${DAGSHUB_ACCESS_ID}
            uv run dvc remote modify origin --local secret_access_key ${DAGSHUB_ACCESS_ID}

      # 7. Pull target-specific DVC artifacts
      - name: Pull target DVC artifacts
        run: |
          if [ "${{ matrix.service }}" = "api" ]; then
            uv run dvc pull models/preprocessor.joblib models/model.ubj models/card.json
          else
            uv run dvc pull data/raw/test.csv
          fi

      # 8. Login to GitHub Container Registry (GHCR)
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 9. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # 10. Extract metadata tags and labels
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short

      # 11. Build image locally
      - name: Build image locally in Docker daemon
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Containerfile.${{ matrix.service }}
          load: true
          tags: ${{ env.IMAGE_NAME }}:test-scan
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # 12. Run security scan against local image
      - name: Scan container image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:test-scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      # 13. Push security-cleared container image to GHCR
      - name: Push container image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Containerfile.${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
